<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini Editor</title><style> * { box-sizing: border-box; margin: 0; padding: 0; font-size: 16px; } body { padding: 8px; display: flex; flex-direction: column; height: 100vh; background: #fff; } input, button { padding: 12px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; } textarea { flex-grow: 1; width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; resize: none; } button { background: #007bff; color: #fff; font-weight: bold; border: none; cursor: pointer; } </style></head><body><input type="file" id="f" accept=".txt"><textarea id="t" placeholder="..."></textarea><button id="s">Save</button><script> let n = "file.txt"; f.onchange = () => { if (f.files && f.files[0]) { n = f.files[0].name; const r = new FileReader(); r.onload = e => t.value = e.target.result; r.readAsText(f.files[0]); } }; s.onclick = () => { const a = document.createElement('a'); a.download = n; a.href = URL.createObjectURL(new Blob([t.value], {type: 'text/plain'})); a.click(); URL.revokeObjectURL(a.href); }; </script></body></html>
